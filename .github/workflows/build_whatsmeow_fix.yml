name: Build (whatsmeow-fix)
# So COMPILA a imagem (sem push): e o jeito de ver o erro de build sem Go/Docker na maquina.
on:
  push:
    branches: [ whatsmeow-fix ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (linux/amd64, sem push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          build-args: |
            VERSION=0.7.2-whatsmeow-fix
